services:
  - type: web
    name: ecoconecta-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string do Neon (ex.: postgresql://user:pass@host/db?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Opcional: origens permitidas separadas por vírgula (vazio = qualquer origem)
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
